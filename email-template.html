<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmation</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:32px 16px 0;">

        <table width="500" cellpadding="0" cellspacing="0" style="max-width:500px;width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://raw.githubusercontent.com/charleswinfield108/RocketApp/dev/client/assets/images/AppLogoV1.png"
                   alt="Rocket Food Delivery"
                   width="280"
                   style="display:block;margin:0 auto;max-width:280px;height:auto;border:0;" />
            </td>
          </tr>

          <!-- Grey box -->
          <tr>
            <td style="background-color:#f0f0f0;padding:24px 28px;border-radius:4px;">
              <p style="margin:0 0 12px;font-size:18px;font-weight:bold;color:#DA583B;">
                Thank you, {{ firstName }}!
              </p>
              <p style="margin:0;font-size:14px;color:#333333;line-height:1.7;">
                We have received your Order (ID: #{{ order_id }}) for the Restaurant: {{ restaurant_name }}
                and with a total cost of {{ order_total_cost }}. We are currently processing your order and
                will soon be on our way to deliver to you.
              </p>
            </td>
          </tr>

          <!-- Closing -->
          <tr>
            <td style="padding:28px 4px 40px;">
              <p style="margin:0;font-size:15px;font-weight:bold;color:#222126;">Sincerely,</p>
              <p style="margin:4px 0 0;font-size:14px;color:#222126;">Rocket Food Delivery</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
